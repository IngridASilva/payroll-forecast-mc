name: CI

on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
  schedule:
    # Reprojeção mensal, dia 5, depois do fechamento contábil.
    - cron: "0 7 5 * *"

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest tests -q

  forecast:
    needs: testes
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e .
      - run: forecast --base data_base --saida reports
      - uses: actions/upload-artifact@v4
        with:
          name: forecast-folha
          path: reports/
          retention-days: 180
